<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>本周菜单</title>
  <style>
    :root {
      --primary: #e07a5f;
      --primary-light: #fdf0ec;
      --accent: #3d405b;
      --text: #333;
      --muted: #aaa;
      --border: #e0dbd4;
      --bg: #f4f2ef;
      --card: #fff;
      --soup: #c0392b;
      --main: #27ae60;
      --veg: #2980b9;
      --thu-bg: #fffbf0;
      --thu-border: #f39c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 15px; }
    body {
      font-family: -apple-system, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* ─── Header ─── */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header h1 { font-size: 17px; font-weight: 700; color: var(--accent); }
    .header p { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ─── Tab Bar ─── */
    .tab-bar {
      display: flex;
      gap: 5px;
      padding: 10px 12px 8px;
      background: var(--bg);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      flex: 1;
      min-width: 56px;
      max-width: 80px;
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--card);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .tab.thu { border-color: var(--thu-border); }
    .tab.active.thu { background: #f39c12; border-color: #f39c12); }
    .tab .t { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .tab .s { font-size: 10px; opacity: 0.7; display: block; margin-top: 2px; }

    /* ─── Editor ─── */
    #editor { padding: 12px 12px 16px; }

    .day-card {
      background: var(--card);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }
    .day-card.thu { border-color: var(--thu-border); background: var(--thu-bg); }

    .day-header {
      padding: 12px 14px;
      background: #fafaf8;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-card.thu .day-header { background: #fff8e1; }
    .day-header .left .title { font-size: 16px; font-weight: 700; color: var(--accent); }
    .day-header .left .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .day-card.thu .day-header .sub { color: #d68910; }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #ede9e3;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .day-card.thu .badge { background: #ffeaa7; color: #d68910; }

    .section { padding: 9px 12px; border-bottom: 1px solid var(--border); }
    .section:last-child { border-bottom: none; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 5px; padding-left: 2px; }
    .section.soup .section-label { color: var(--soup); }
    .section.main .section-label { color: var(--main); }
    .section.veg .section-label { color: var(--veg); }

    .dish-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background 0.12s;
      min-height: 48px;
    }
    .dish-item:active { background: #f0ebe6; }
    .dish-item .icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .section.soup .icon { background: #fdebd0; }
    .section.main .icon { background: #d5f5e3; }
    .section.veg .icon { background: #d6eaf8; }
    .dish-item .name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
    }
    .dish-item .arrow {
      font-size: 14px;
      color: var(--primary);
      opacity: 0.6;
      flex-shrink: 0;
    }

    /* ─── Bottom Bar ─── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    }
    .bottom-bar .info {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }
    .bottom-bar .info strong { color: var(--primary); font-size: 15px; }
    .btn {
      padding: 9px 16px;
      border-radius: 22px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      -webkit-user-select: none;
    }
    .btn-ghost { background: #ece8e2; color: var(--accent); }
    .btn-ghost:active { background: #ddd8d0; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: #c4624a; }

    /* ─── Result Phase ─── */
    #result { display: none; padding: 12px 12px 20px; }
    #result.show { display: block; }

    .result-summary {
      background: linear-gradient(135deg, var(--primary), #c4624a);
      border-radius: 14px;
      padding: 16px 18px;
      color: #fff;
      text-align: center;
      margin-bottom: 14px;
    }
    .result-summary h2 { font-size: 17px; }
    .result-summary p { font-size: 11px; opacity: 0.8; margin-top: 3px; }
    .result-summary .edit-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 20px;
      background: rgba(255,255,255,0.22);
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      color: #fff;
    }
    .result-summary .edit-btn:active { background: rgba(255,255,255,0.32); }

    .result-card {
      background: var(--card);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .result-card.thu { border-color: var(--thu-border); }
    .result-card-header {
      padding: 12px 14px;
      background: #fafaf8;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-card.thu .result-card-header { background: #fff8e1; }
    .result-card-header .title { font-size: 15px; font-weight: 700; color: var(--accent); }
    .result-card-header .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .result-card.thu .result-card-header .sub { color: #d68910; }
    .result-card-header .badge {
      background: #ffeaa7; color: #d68910;
      font-size: 10px; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
    }

    .result-dish {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      min-height: 46px;
    }
    .result-dish:last-child { border-bottom: none; }
    .result-dish .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .result-dish.soup .dot { background: var(--soup); }
    .result-dish.main .dot { background: var(--main); }
    .result-dish.veg .dot { background: var(--veg); }
    .result-dish .type { font-size: 10px; color: var(--muted); width: 30px; flex-shrink: 0; }
    .result-dish .name { flex: 1; font-size: 14px; font-weight: 500; }

    .print-row { text-align: center; margin-top: 14px; }
    .print-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 11px 26px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .print-btn:active { background: #2d2f47; }

    /* ─── Modal ─── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: var(--card);
      border-radius: 18px 18px 0 0;
      width: 100%; max-width: 600px;
      max-height: 72vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 14px 24px;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
      padding: 0 2px;
    }
    .modal-header h3 { font-size: 15px; font-weight: 700; color: var(--accent); }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      border: none; background: #f0ece6;
      font-size: 18px; cursor: pointer; color: var(--muted);
    }
    .modal-list { display: flex; flex-direction: column; gap: 6px; }
    .modal-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      transition: border-color 0.12s, background 0.12s;
      min-height: 50px;
    }
    .modal-item:active { border-color: var(--primary); background: var(--primary-light); }
    .modal-item .emoji { font-size: 20px; flex-shrink: 0; }
    .modal-item .name { flex: 1; }
    .modal-item .check { color: var(--primary); font-size: 16px; }
    .modal-tip { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0 2px; }

    /* ─── Print ─── */
    @media print {
      .header, .tab-bar, .bottom-bar, .print-row, .result-summary .edit-btn { display: none !important; }
      #editor { display: none !important; }
      #result { display: block !important; padding: 0 !important; }
      body { padding: 0 !important; background: #fff !important; }
      .result-summary { background: var(--primary) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .result-card { border: 1px solid #ddd !important; margin-bottom: 10px !important; break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍽️ 本周菜单</h1>
  <p id="headerSub">点击菜品更换 · 确认后生成最终结果</p>
</div>

<div class="tab-bar" id="tabBar"></div>

<div id="editor">
  <div class="day-card" id="dayCard">
    <div class="day-header">
      <div class="left">
        <div class="title" id="dayTitle">周一</div>
        <div class="sub" id="daySub">AI课 17:15</div>
      </div>
      <div class="badge" id="dayBadge">17:15 接送</div>
    </div>
    <div id="dishSections"></div>
  </div>
</div>

<div id="result">
  <div class="result-summary">
    <h2>✅ 本周菜单已确认</h2>
    <p id="resultDate"></p>
    <button class="edit-btn" onclick="editPlan()">重新编辑</button>
  </div>
  <div id="resultCards"></div>
  <div class="print-row">
    <button class="print-btn" onclick="window.print()">🖨️ 打印菜单</button>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="info">当前：<strong id="curLabel">周一</strong></div>
  <button class="btn btn-ghost" onclick="randomAll()">🎲 换一批</button>
  <button class="btn btn-primary" onclick="showResult()">确认菜单</button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h3 id="modalTitle">选择菜品</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-list" id="modalList"></div>
    <div class="modal-tip">点击选中，再点其他继续更换</div>
  </div>
</div>

<script>
// ── DATA ──
const D = {
  soup:[
    {n:'番茄榨菜汤',e:'🍅'},{n:'山药排骨汤',e:'🥣'},{n:'青菜肉丸粉丝汤',e:'🥬'},
    {n:'玉米粉丝排骨汤',e:'🌽'},{n:'番茄金针菇肥牛锅',e:'🍅'},{n:'番茄牛腩',e:'🍅'},
    {n:'青菜三鲜汤',e:'🥬'},{n:'白菜粉丝汤',e:'🥬'},{n:'青菜香菇鸡肉汤',e:'🍄'},
    {n:'冬瓜烩三鲜（虾丸）',e:'🎃'},
  ],
  main:[
    {n:'红烧鸡翅',e:'🍗'},{n:'可乐鸡翅',e:'🥤'},{n:'糖醋排骨',e:'🍖'},
    {n:'红烧肉+土豆',e:'🥘'},{n:'红烧猪蹄',e:'🐷'},{n:'油爆罗氏虾',e:'🦐'},
    {n:'糖醋罗氏虾',e:'🦐'},{n:'鲜虾豆腐煲',e:'🦐'},{n:'白切牛腱子',e:'🐄'},
    {n:'泉水牛肉',e:'💧'},{n:'三文鱼',e:'🐟'},{n:'清蒸鲈鱼',e:'🐟'},
    {n:'梅干菜汪刺鱼',e:'🐟'},{n:'雪菜汪刺鱼',e:'🐟'},{n:'腊肠蒸蛋',e:'🌭'},
    {n:'腊肠炖蛋',e:'🌭'},{n:'肉饼蒸蛋',e:'🥚'},{n:'清蒸梭子蟹',e:'🦀'},
  ],
  veg:[
    {n:'鱼香肉丝',e:'🥩'},{n:'雪菜炒鱿鱼',e:'🦑'},{n:'韭菜笋丝',e:'🌱'},
    {n:'炒土豆丝',e:'🥔'},{n:'塌扁小土豆',e:'🥔'},{n:'红烧土豆',e:'🥔'},
    {n:'蒜蓉粉丝娃娃菜',e:'🥬'},{n:'上汤白菜',e:'🥬'},{n:'清炒鸡毛菜',e:'🥬'},
    {n:'西兰花清炒',e:'🥦'},{n:'清炒藕片',e:'🪷'},{n:'油焖茭白',e:'🎋'},
    {n:'毛豆烧豆腐',e:'🫘'},{n:'凉拌黄瓜',e:'🥒'},{n:'香菇青菜',e:'🍄'},
  ]
};
const I = {};
[...D.soup,...D.main,...D.veg].forEach(x=>I[x.n]=x.e);

const DAYS=[
  {k:'Mon',l:'一',sub:'AI课 17:15',badge:'17:15 接送'},
  {k:'Tue',l:'二',sub:'篮球 17:15',badge:'17:15 接送'},
  {k:'Wed',l:'三',sub:'乐高 17:15',badge:'17:15 接送'},
  {k:'Thu',l:'四',sub:'16:00放学·英语课18:30',badge:'18:00前吃完',thu:true},
  {k:'Fri',l:'五',sub:'羽毛球 17:15',badge:'17:15 接送'},
];

// ── STATE ──
let P={
  Mon:{s:'山药排骨汤（加胡萝卜）',m:'红烧鸡翅',v:['雪菜炒鱿鱼','清炒鸡毛菜']},
  Tue:{s:'番茄榨菜汤',m:'糖醋排骨',v:['西兰花炒虾仁','凉拌黄瓜']},
  Wed:{s:'青菜肉丸粉丝汤',m:'清蒸鲈鱼',v:['蒜蓉粉丝娃娃菜']},
  Thu:{s:'番茄金针菇肥牛（一锅出）',m:'腊肠蒸蛋',v:['清炒青菜']},
  Fri:{s:'玉米粉丝排骨汤',m:'可乐鸡翅',v:['鱼香肉丝','上汤白菜']},
};
let cur='Mon',editing=true,pick={day:null,slot:null,vIdx:null};

// ── RENDER ──
function render(){
  renderTabs();
  renderEditor();
  if(editing){
    document.getElementById('editor').style.display='block';
    document.getElementById('result').classList.remove('show');
    document.getElementById('bottomBar').style.display='flex';
    document.getElementById('tabBar').style.display='flex';
    document.getElementById('headerSub').textContent='点击菜品更换 · 确认后生成最终结果';
  }
}

function renderTabs(){
  document.getElementById('tabBar').innerHTML=DAYS.map(d=>`
    <div class="tab ${d.thu?'thu':''} ${cur===d.k?'active':''}" onclick="selectDay('${d.k}')">
      <div class="t">周${d.l}</div>
      <div class="s">${d.thu?'⚡赶课':''}</div>
    </div>
  `).join('');
}

function renderEditor(){
  const day=DAYS.find(x=>x.k===cur);
  const p=P[cur];
  document.getElementById('dayTitle').textContent=`周${day.l}`;
  document.getElementById('daySub').textContent=day.sub;
  document.getElementById('dayBadge').textContent=day.badge;
  document.getElementById('curLabel').textContent=`周${day.l}`;
  const card=document.getElementById('dayCard');
  card.className=`day-card${day.thu?' thu':''}`;
  document.getElementById('dishSections').innerHTML=[
    {t:'soup',l:'🥣 汤'},
    {t:'main',l:'🍖 主荤 / 蒸菜'},
    {t:'veg',l:'🥦 炒菜'},
  ].map(({t,l})=>`
    <div class="section ${t}">
      <div class="section-label">${l}</div>
      ${t==='veg'?p.v.map((v,i)=>dishRow(t,v,i)).join(''):dishRow(t,p[t],0)}
    </div>
  `).join('');
}

function dishRow(type,name,vIdx){
  return `
    <div class="dish-item ${type}" onclick="openPick('${type}',${vIdx})">
      <div class="icon">${I[name]||'🍽️'}</div>
      <div class="name">${name}</div>
      <div class="arrow">›</div>
    </div>`;
}

// ── PICKER ──
function openPick(slot,vIdx){
  if(!editing)return;
  pick={day:cur,slot,vIdx};
  const curName=slot==='veg'?P[cur].v[vIdx]:P[cur][slot];
  const L={soup:'🥣 汤',main:'🍖 主荤/蒸菜',veg:'🥦 炒菜'};
  document.getElementById('modalTitle').textContent=`周${DAYS.find(x=>x.k===cur).l} · ${L[slot]}`;
  document.getElementById('modalList').innerHTML=D[slot].map(d=>`
    <div class="modal-item ${d.n===curName?'current':''}"
         style="${d.n===curName?'border-color:var(--primary);background:var(--primary-light)':''}"
         onclick="doPick('${d.n.replace(/'/g,"\\'")}')">
      <span class="emoji">${d.e}</span>
      <span class="name">${d.n}</span>
      ${d.n===curName?'<span class="check">✓</span>':''}
    </div>
  `).join('');
  document.getElementById('modal').classList.add('show');
}

function doPick(name){
  const{day,slot,vIdx}=pick;
  if(slot==='veg')P[day].v[vIdx]=name;else P[day][slot]=name;
  closeModal();renderEditor();
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  pick={day:null,slot:null,vIdx:null};
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function selectDay(k){cur=k;renderTabs();renderEditor();}

// ── ACTIONS ──
function randomAll(){
  DAYS.forEach(d=>{
    P[d.k].s=D.soup[r()].n;
    P[d.k].m=D.main[r()].n;
    P[d.k].v=[D.veg[r()].n,D.veg[r()].n];
  });
  cur='Mon';render();
}
function r(){return Math.floor(Math.random()*1e3)%20;}

function showResult(){
  editing=false;
  document.getElementById('editor').style.display='none';
  document.getElementById('tabBar').style.display='none';
  document.getElementById('bottomBar').style.display='none';
  document.getElementById('result').classList.add('show');
  document.getElementById('headerSub').textContent='最终确认菜单 · 可打印或截图发给阿姨';
  const now=new Date();
  document.getElementById('resultDate').textContent=
    `生成：${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('resultCards').innerHTML=DAYS.map(d=>{
    const p=P[d.k];
    return `
      <div class="result-card${d.thu?' thu':''}">
        <div class="result-card-header">
          <div>
            <div class="title">周${d.l}</div>
            <div class="sub">${d.sub}</div>
          </div>
          <div class="badge">${d.badge}</div>
        </div>
        ${dishLine('soup','汤',p.s)}
        ${dishLine('main','主荤',p.m)}
        ${p.v.map((v,i)=>dishLine('veg','炒菜'+(p.v.length>1?i+1:''),v)).join('')}
      </div>`;
  }).join('');
}

function dishLine(type,label,name){
  return `
    <div class="result-dish ${type}">
      <div class="dot"></div>
      <div class="type">${label}</div>
      <div class="name">${I[name]||'🍽️'} ${name}</div>
    </div>`;
}

function editPlan(){
  editing=true;
  document.getElementById('editor').style.display='block';
  document.getElementById('tabBar').style.display='flex';
  document.getElementById('bottomBar').style.display='flex';
  document.getElementById('result').classList.remove('show');
  render();
}

render();
</script>
